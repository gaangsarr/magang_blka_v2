<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histori Pendaftar — Admin BLKA ITPLN</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/img/logo_itpln.png">
    <link rel="apple-touch-icon" href="/assets/img/logo_itpln.png">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
    <div class="admin-layout">
        <!-- Dynamic Sidebar Navigation -->
        <aside id="admin-sidebar" class="admin-sidebar"></aside>

        <!-- Main Content Area -->
        <main class="admin-main">
            <!-- Topbar Header -->
            <header class="admin-topbar">
                <div class="topbar-title-group">
                    <h1>Histori Pendaftar</h1>
                    <p>Arsip data pendaftaran dan statistik magang dari periode-periode sebelumnya</p>
                </div>

                <div class="admin-profile-badge">
                    <div class="admin-avatar" id="admin-avatar">A</div>
                    <div class="admin-user-info">
                        <span class="admin-user-name" id="admin-name">Administrator</span>
                        <span class="admin-user-role" id="admin-role">Admin BLKA</span>
                    </div>
                </div>
            </header>

            <!-- Main Content Container -->
            <div class="admin-content">
                <div id="histori-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;">
                    <div style="text-align: center; color: #64748b; padding: 40px; grid-column: 1 / -1;">
                        Memuat data histori periode...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/js/admin/common.js"></script>
    <script type="module" src="/js/admin/histori.js"></script>
</body>
</html>
