<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin — BLKA ITPLN × PLN</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/img/logo_itpln.png">
    <link rel="apple-touch-icon" href="/assets/img/logo_itpln.png">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="dot-bg">
    <div class="admin-login-screen">
        <div class="admin-login-card">
            <!-- Header Logos & Branding -->
            <div class="admin-login-header">
                <div class="admin-login-logos">
                    <img src="/assets/img/logo_pln.png" alt="Logo PLN" class="admin-logo-img" />
                    <img src="/assets/img/logo_itpln.png" alt="Logo ITPLN" class="admin-logo-img" />
                </div>
                <h1 class="admin-login-title">Portal Admin BLKA</h1>
                <p class="admin-login-desc">Sistem Pengelolaan Program Magang Mahasiswa</p>
            </div>
            
            <!-- Login Form -->
            <form id="form-login">
                <div class="admin-input-group">
                    <label class="admin-input-label" for="email">Email Administrator</label>
                    <div class="admin-input-wrapper">
                        <svg class="admin-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        </svg>
                        <input type="email" id="email" class="admin-input-field" required placeholder="admin@itpln.ac.id" autocomplete="email" />
                    </div>
                </div>

                <div class="admin-input-group">
                    <label class="admin-input-label" for="password">Kata Sandi</label>
                    <div class="admin-input-wrapper">
                        <svg class="admin-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" class="admin-input-field" required placeholder="Masukkan kata sandi..." autocomplete="current-password" />
                    </div>
                </div>
                
                <div id="error-box" class="alert alert-error hidden" style="margin-bottom: 16px; font-size: 0.85rem;"></div>
                
                <button type="submit" class="btn-admin-login" id="btn-login">Masuk ke Portal Admin</button>
            </form>
        </div>

        <a href="/login.html" class="admin-back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
            </svg>
            <span>Kembali ke Beranda Utama</span>
        </a>
    </div>

    <script type="module" src="/js/admin/login.js"></script>
</body>
</html>
