<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Login Admin — REMATE ITPLN</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/img/logo_itpln.png">
    <link rel="apple-touch-icon" href="/assets/img/logo_itpln.png">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .admin-login-screen {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            box-sizing: border-box;
        }

        .admin-login-card {
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid rgba(226, 232, 240, 0.95);
            box-shadow: 0 20px 40px -15px rgba(11, 61, 107, 0.12), 0 1px 3px rgba(0, 0, 0, 0.05);
            padding: 36px 30px 28px;
            max-width: 430px;
            width: 100%;
            position: relative;
            box-sizing: border-box;
            animation: modalSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .admin-login-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .admin-login-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .admin-logo-img {
            height: 36px;
            width: auto;
            object-fit: contain;
        }

        .admin-login-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #0b3d6b;
            margin: 0 0 6px 0;
            letter-spacing: -0.02em;
        }

        .admin-login-desc {
            font-size: 0.825rem;
            color: #64748b;
            line-height: 1.45;
            margin: 0;
        }

        .admin-input-group {
            margin-bottom: 18px;
        }

        .admin-input-label {
            display: block;
            font-size: 0.825rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .admin-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .admin-input-icon {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            pointer-events: none;
            z-index: 2;
        }

        .admin-input-field {
            width: 100%;
            height: 44px;
            padding: 10px 14px 10px 42px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 0.875rem;
            color: #0f172a;
            background: #ffffff;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .admin-input-field:focus {
            outline: none;
            border-color: #0b3d6b;
            box-shadow: 0 0 0 3px rgba(11, 61, 107, 0.12);
        }

        .admin-password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            transition: color 0.15s;
        }

        .admin-password-toggle:hover {
            color: #0b3d6b;
        }

        .btn-admin-login {
            width: 100%;
            height: 44px;
            padding: 0 16px;
            background: #0b3d6b;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 0.925rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(11, 61, 107, 0.2);
            transition: all 0.15s ease;
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-admin-login:hover {
            background: #072744;
        }

        .btn-admin-login:active {
            transform: scale(0.98);
        }

        .admin-login-help-box {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px dashed #e2e8f0;
            font-size: 0.775rem;
            color: #64748b;
            line-height: 1.5;
            text-align: center;
        }

        .admin-back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            font-size: 0.825rem;
            font-weight: 600;
            color: #64748b;
            text-decoration: none;
            transition: color 0.2s ease;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .admin-back-link:hover {
            color: #004687;
            background: rgba(0, 70, 135, 0.05);
        }

        @media (max-width: 480px) {
            .admin-login-screen {
                padding: 20px 14px 32px;
                justify-content: center;
            }
            .admin-login-card {
                padding: 26px 18px 22px;
                border-radius: 16px;
            }
            .admin-logo-img {
                height: 30px;
            }
            .admin-login-title {
                font-size: 1.2rem;
            }
            .admin-login-desc {
                font-size: 0.775rem;
            }
            .admin-input-field {
                font-size: 0.825rem;
                height: 42px;
            }
            .btn-admin-login {
                height: 42px;
                font-size: 0.875rem;
            }
            .admin-login-help-box {
                font-size: 0.725rem;
            }
        }
    </style>
</head>
<body class="dot-bg">
    <div class="admin-login-screen">
        <div class="admin-login-card">
            <!-- Header Logos & Branding -->
            <div class="admin-login-header">
                <div class="admin-login-logos">
                    <img src="/assets/img/logo_pln.png" alt="Logo PLN" class="admin-logo-img" />
                    <img src="/assets/img/logo_itpln.png" alt="Logo ITPLN" class="admin-logo-img" />
                </div>
                <h1 class="admin-login-title">Portal Admin REMATE</h1>
                <p class="admin-login-desc">Rekrutmen Magang Talenta Energi ITPLN × PLN</p>
            </div>
            
            <!-- Login Form -->
            <form id="form-login">
                <div class="admin-input-group">
                    <label class="admin-input-label" for="identifier">Email Kampus atau Username Kantor</label>
                    <div class="admin-input-wrapper">
                        <svg class="admin-input-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        </svg>
                        <input type="text" id="identifier" class="admin-input-field" required placeholder="admin@itpln.ac.id atau up3metro" autocomplete="username" />
                    </div>
                </div>

                <div class="admin-input-group">
                    <label class="admin-input-label" for="password">Kata Sandi</label>
                    <div class="admin-input-wrapper">
                        <svg class="admin-input-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" class="admin-input-field" required placeholder="Masukkan kata sandi..." autocomplete="current-password" style="padding-right: 40px;" />
                        <button type="button" id="btn-toggle-password" class="admin-password-toggle" title="Tampilkan / Sembunyikan Kata Sandi" aria-label="Toggle Password Visibility">
                            <svg id="icon-eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg id="icon-eye-hide" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                        </button>
                    </div>
                </div>
                
                <div id="error-box" class="alert alert-error hidden" style="margin-bottom: 16px; font-size: 0.85rem;"></div>
                
                <button type="submit" class="btn-admin-login" id="btn-login">
                    <span>Masuk ke Portal</span>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
            </form>

            <div class="admin-login-help-box">
                <div style="display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; color: #004687; margin-bottom: 4px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M8 14h.01"/><path d="M16 14h.01"/></svg>
                    <span>Akses Mitra Perusahaan / Unit PLN</span>
                </div>
                Gunakan username unit & kata sandi dari Surat Kredensial BLKA.<br>
                Kendala akses / lupa kata sandi? Hubungi <a href="mailto:blka@itpln.ac.id" style="color: #004687; font-weight: 600; text-decoration: underline;">blka@itpln.ac.id</a>
            </div>
        </div>

        <a href="/login.html" class="admin-back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
            </svg>
            <span>Kembali ke Beranda Utama</span>
        </a>
    </div>

    <script type="module" src="/js/admin/login.js"></script>
</body>
</html>
