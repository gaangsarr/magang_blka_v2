<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin — REMATE (Rekrutmen Magang Talenta Energi)</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/img/logo_itpln.png">
    <link rel="apple-touch-icon" href="/assets/img/logo_itpln.png">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="dot-bg">
    <div class="admin-login-screen">
        <div class="admin-login-card">
            <!-- Header Logos & Branding -->
            <div class="admin-login-header">
                <div class="admin-login-logos">
                    <img src="/assets/img/logo_pln.png" alt="Logo PLN" class="admin-logo-img" />
                    <img src="/assets/img/logo_itpln.png" alt="Logo ITPLN" class="admin-logo-img" />
                </div>
                <h1 class="admin-login-title">Portal Admin REMATE</h1>
                <p class="admin-login-desc">Rekrutmen Magang Talenta Energi ITPLN × PLN</p>
            </div>
            
            <!-- Login Form -->
            <form id="form-login">
                <div class="admin-input-group">
                    <label class="admin-input-label" for="identifier">Email Kampus atau Username Kantor</label>
                    <div class="admin-input-wrapper">
                        <svg class="admin-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        </svg>
                        <input type="text" id="identifier" class="admin-input-field" required placeholder="admin@itpln.ac.id atau up3metro" autocomplete="username" />
                    </div>
                </div>

                <div class="admin-input-group">
                    <label class="admin-input-label" for="password">Kata Sandi</label>
                    <div class="admin-input-wrapper">
                        <svg class="admin-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" class="admin-input-field" required placeholder="Masukkan kata sandi..." autocomplete="current-password" />
                    </div>
                </div>
                
                <div id="error-box" class="alert alert-error hidden" style="margin-bottom: 16px; font-size: 0.85rem;"></div>
                
                <button type="submit" class="btn-admin-login" id="btn-login">Masuk ke Portal</button>
            </form>

            <div style="margin-top: 20px; padding-top: 16px; border-top: 1px dashed #e2e8f0; font-size: 0.8rem; color: #64748b; line-height: 1.5; text-align: center;">
                <div style="display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; color: #004687; margin-bottom: 4px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M8 14h.01"/><path d="M16 14h.01"/></svg>
                    <span>Akses Mitra Perusahaan / Unit PLN</span>
                </div>
                Gunakan username unit & kata sandi dari Surat Kredensial BLKA.<br>
                Kendala akses / lupa kata sandi? Hubungi <a href="mailto:blka@itpln.ac.id" style="color: #004687; font-weight: 600; text-decoration: underline;">blka@itpln.ac.id</a>
            </div>
        </div>

        <a href="/login.html" class="admin-back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
            </svg>
            <span>Kembali ke Beranda Utama</span>
        </a>
    </div>

    <script type="module" src="/js/admin/login.js"></script>
</body>
</html>
