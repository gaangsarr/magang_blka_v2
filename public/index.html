<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REMATE : Rekrutmen Magang Talenta Energi | ITPLN × PT PLN (Persero)</title>
  <link rel="icon" type="image/png" href="/assets/img/logo_itpln.png" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0B192C;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: #F8FAFC;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: #94A3B8;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #00A2B9;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <span>Memeriksa sesi login...</span>
  </div>

  <script>
    /**
     * index.html — Entry Point
     * Cek session aktif via /api/auth/status.php lalu redirect:
     *   - Belum login            → /login.html
     *   - Login, belum mendaftar → /daftar.html
     *   - Login, sudah mendaftar → /status.html
     *   - Admin                  → /admin/index.html
     */
    (async function () {
      try {
        const res  = await fetch('/api/auth/status.php', { credentials: 'same-origin' });
        const data = await res.json();

        if (!data.authenticated) {
          window.location.replace('/login.html');
          return;
        }

        if (data.role === 'admin') {
          window.location.replace('/admin/index.html');
          return;
        }

        // Mahasiswa
        if (data.sudah_mendaftar) {
          window.location.replace('/status.html');
        } else {
          window.location.replace('/daftar.html');
        }

      } catch (_) {
        // Jika API tidak bisa diakses (mis. PHP belum jalan), langsung ke login
        window.location.replace('/login.html');
      }
    })();
  </script>
</body>
</html>
